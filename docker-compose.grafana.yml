services:
  loki:
    image: grafana/loki:3.7.0
    container_name: fair-visit-report-loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:latest
    container_name: fair-visit-report-alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345"
      - "1514:1514/udp"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: fair-visit-report-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki

volumes:
  loki_data:
  alloy_data:
  grafana_data: