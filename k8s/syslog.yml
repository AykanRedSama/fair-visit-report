apiVersion: v1
kind: ConfigMap
metadata:
  name: syslog-config
  namespace: fair-visit-report
data:
  syslog-ng.conf: |
    @version: 4.0

    source s_network {
        network(
            ip("0.0.0.0")
            port(514)
            transport("udp")
        );
    };

    destination d_stdout {
        file("/dev/stdout");
    };

    log {
        source(s_network);
        destination(d_stdout);
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog
  namespace: fair-visit-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syslog
  template:
    metadata:
      labels:
        app: syslog
    spec:
      containers:
        - name: syslog
          image: balabit/syslog-ng:latest
          ports:
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
          volumeMounts:
            - name: syslog-config
              mountPath: /etc/syslog-ng/syslog-ng.conf
              subPath: syslog-ng.conf
              readOnly: true
      volumes:
        - name: syslog-config
          configMap:
            name: syslog-config
---
apiVersion: v1
kind: Service
metadata:
  name: syslog
  namespace: fair-visit-report
spec:
  selector:
    app: syslog
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 514
      protocol: UDP
  type: ClusterIP