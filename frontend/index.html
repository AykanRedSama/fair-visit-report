
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibition Fair Visit Reports</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Exhibition Fair Visit Reports</span>
        </div>
    </nav>

    <main class="container">
        <section class="mb-5">
            <div class="card">
                <div class="card-header">
                    <h2 class="h5 mb-0">Create Visit Report</h2>
                </div>

                <div class="card-body">
                    <form id="visitReportForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Name *</label>
                                <input type="text" class="form-control" id="name" required maxlength="255" autocomplete="name">
                            </div>

                            <div class="col-md-6">
                                <label for="position" class="form-label">Position</label>
                                <input type="text" class="form-control" id="position" maxlength="255" autocomplete="organization-title">
                            </div>

                            <div class="col-md-6">
                                <label for="company" class="form-label">Company</label>
                                <input type="text" class="form-control" id="company" maxlength="255" autocomplete="organization">
                            </div>

                            <div class="col-md-6">
                                <label for="mailAddress" class="form-label">Mail Address</label>
                                <input type="email" class="form-control" id="mailAddress" maxlength="320" autocomplete="email">
                            </div>

                            <div class="col-md-6">
                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="phoneNumber" maxlength="100" autocomplete="tel">
                            </div>

                            <div class="col-12">
                                <label for="reportText" class="form-label">Visit Report Text *</label>
                                <textarea class="form-control" id="reportText" rows="4" required maxlength="5000"></textarea>
                            </div>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Save Report</button>
                            <button type="reset" class="btn btn-secondary">Clear</button>
                        </div>
                    </form>

                    <div id="formMessage" class="mt-3"></div>
                </div>
            </div>
        </section>

        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Visit Report Overview</h2>
                <button id="refreshReportsButton" class="btn btn-outline-primary btn-sm">Refresh</button>
            </div>

            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="filterName" class="form-label">Filter by Name</label>
                            <input type="text" class="form-control" id="filterName" autocomplete="off">
                        </div>

                        <div class="col-md-3">
                            <label for="filterCompany" class="form-label">Filter by Company</label>
                            <input type="text" class="form-control" id="filterCompany" autocomplete="off">
                        </div>

                        <div class="col-md-2">
                            <label for="filterExported" class="form-label">Export Status</label>
                            <select class="form-select" id="filterExported">
                                <option value="">All</option>
                                <option value="false">Not Exported</option>
                                <option value="true">Exported</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label for="sortBy" class="form-label">Sort By</label>
                            <select class="form-select" id="sortBy">
                                <option value="createdAt">Creation Date</option>
                                <option value="name">Name</option>
                                <option value="company">Company</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label for="sortDirection" class="form-label">Direction</label>
                            <select class="form-select" id="sortDirection">
                                <option value="desc">Descending</option>
                                <option value="asc">Ascending</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button id="applyFiltersButton" class="btn btn-primary btn-sm">Apply Filters</button>
                        <button id="clearFiltersButton" class="btn btn-secondary btn-sm">Clear Filters</button>
                    </div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mb-3">
                <button type="button" class="btn btn-success btn-sm" onclick="exportSelectedReportsFromTable()">Export Selected</button>
                <button type="button" class="btn btn-outline-success btn-sm" onclick="exportAllUnexportedReportsFromTable()">Export All Non-Exported</button>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteAllExportedReportsFromTable()">Delete All Exported</button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Select</th>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Position</th>
                            <th>Company</th>
                            <th>Mail Address</th>
                            <th>Phone Number</th>
                            <th>Created At</th>
                            <th>Export Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="reportsTableBody">
                        <tr>
                            <td colspan="10" class="text-center">No reports loaded.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <button id="previousPageButton" class="btn btn-outline-secondary btn-sm">Previous</button>
                <span id="paginationInfo">Page 1</span>
                <button id="nextPageButton" class="btn btn-outline-secondary btn-sm">Next</button>
            </div>
        </section>
    </main>

    <script src="js/apiClient.js"></script>
      <script src="js/visitReportForm.js"></script>
      <script src="js/visitReportList.js"></script>
       <script src="js/exportReports.js"></script>
      <script src="js/deleteReports.js"></script>
</body>
</html>
