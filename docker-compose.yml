services:
  postgres:
    image: postgres:16
    container_name: fair-visit-report-postgres
    environment:
      POSTGRES_DB: fair_reports
      POSTGRES_USER: fair_user
      POSTGRES_PASSWORD: fair_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fair_user -d fair_reports"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: fair-visit-report-api
    build:
      context: ./src/FairVisitReport.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fair_reports;Username=fair_user;Password=fair_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: