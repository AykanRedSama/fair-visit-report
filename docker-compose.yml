services:
  postgres:
    image: postgres:16
    container_name: fair-visit-report-postgres
    environment:
      POSTGRES_DB: fair_reports
      POSTGRES_USER: fair_user
      POSTGRES_PASSWORD: fair_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fair_user -d fair_reports"]
      interval: 5s
      timeout: 5s
      retries: 10

  syslog:
    image: balabit/syslog-ng:latest
    container_name: fair-visit-report-syslog
    volumes:
      - ./syslog/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    ports:
      - "514:514/udp"

  api:
    container_name: fair-visit-report-api
    build:
      context: ./src/FairVisitReport.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fair_reports;Username=fair_user;Password=fair_password
      Syslog__Host: syslog
      Syslog__Port: 514
      Logging__LogLevel__Default: Information
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      syslog:
        condition: service_healthy

  frontend:
    container_name: fair-visit-report-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: